    <script type="x-shader/x-vertex" id="rw-title-vs">
        attribute vec2 a_position;
        varying vec2 v_uv;
        void main() {
            v_uv = a_position * 0.5 + 0.5;
            gl_Position = vec4(a_position, 0.0, 1.0);
        }
    </script>

    <script type="x-shader/x-fragment" id="rw-title-fs">
        precision highp float;
        uniform sampler2D u_main;
        uniform sampler2D u_gradient;
        uniform float u_gradientWidth;
        uniform float u_spriteRed;
        uniform float u_rain;
        uniform vec4 u_rect;
        uniform vec2 u_window;
        varying vec2 v_uv;
        void main() {
            vec2 scr = vec2((u_rect.x + v_uv.x * u_rect.z) / u_window.x, (u_rect.y + v_uv.y * u_rect.w) / u_window.y);
            vec4 tex = texture2D(u_main, v_uv);
            float h = (scr.x * 0.7 - scr.y * 0.19 + u_rain * 0.7) * mix(0.75, 1.0, u_spriteRed) + tex.x * tex.x * tex.x * -0.0125;
            float band = floor(h * 50.0);
            float wrapped = band - 50.0 * floor(band / 50.0);
            float texel = floor(wrapped * u_gradientWidth / 50.0 + 0.0001);
            vec3 rgb = texture2D(u_gradient, vec2((texel + 0.5) / u_gradientWidth, 0.5)).xyz;
            gl_FragColor = vec4(rgb * tex.w, tex.w);
        }
    </script>

    <script type="x-shader/x-vertex" id="rw-rain-vs">
        attribute vec2 a_position;
        attribute vec2 a_uv;
        attribute vec4 a_color;
        attribute float a_mode;
        uniform vec2 u_view;
        varying vec2 v_uv;
        varying vec4 v_color;
        varying float v_mode;
        void main() {
            v_uv = a_uv;
            v_color = a_color;
            v_mode = a_mode;
            gl_Position = vec4(a_position / u_view * 2.0 - 1.0, 0.0, 1.0);
        }
    </script>

    <script type="x-shader/x-fragment" id="rw-rain-fs">
        precision highp float;
        uniform sampler2D u_noise;
        varying vec2 v_uv;
        varying vec4 v_color;
        varying float v_mode;
        float centerDistance() {
            return clamp(distance(v_uv, vec2(0.5)) * 2.0, 0.0, 1.0);
        }
        vec4 noisyLight() {
            vec2 base = vec2(v_uv.x * 6.0, v_uv.y * 3.0);
            vec2 delta = vec2(0.5) - v_uv;
            vec2 away = length(delta) > 0.0001 ? normalize(delta) : vec2(0.0);
            float h = 0.0;
            for (int j = 0; j < 4; j++) {
                h += texture2D(u_noise, base + away * 0.02 * float(j)).x;
            }
            h /= 5.0;
            float d = 0.25 * pow(1.0 - v_color.w, 0.5);
            float c = pow(pow(1.0 - pow(centerDistance(), 2.0), 3.5), 1.0 - d + 2.0 * d * h);
            return vec4(v_color.xyz, c * v_color.w);
        }
        vec4 edgeFade() {
            float w = v_color.w;
            float c = 1.0 - pow(1.0 - pow(centerDistance(), mix(5.0, 0.5, w)), 2.0);
            c = mix(c, 1.0, max(0.0, w * w - 0.5) * 2.0);
            return vec4(v_color.xyz, c * pow(w, 0.25));
        }
        void main() {
            if (v_mode < 0.5) {
                gl_FragColor = v_color;
            } else if (v_mode < 1.5) {
                gl_FragColor = noisyLight();
            } else {
                gl_FragColor = edgeFade();
            }
        }
    </script>

    <style>
        /* big flex block of darkness */
        body,
        html {
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* floaty in the center */
        #main-menu {
            margin: auto;
            position: relative;
            z-index: 2;
        }

        /* stuck to the bottom, custom link colors */
        #main-menu-footer {
            margin-bottom: 0.1em;
            text-align: center;
            font-family: 'Segoe UI';
            font-size: 0.8em;
            font-weight: 500;
            color: #A9A4B2;
            /* menu lightgray */
            position: relative;
            z-index: 2;
        }

        #main-menu-footer a:link {
            color: white;
        }

        #main-menu-footer a:visited {
            color: #A9A4B2;
            /* menu lightgray */
        }

        /* expando list, flex that needs wrap on really small displays */
        #scuglist-group {
            margin-left: auto;
            margin-right: auto;
            margin-top: 0.8em;
            margin-bottom: 0.8em;
            width: fit-content;
            max-width: 100vw;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        #scuglist-group>div {
            width: 200px;
            position: relative;
            /* re-center after wrap */
            margin-left: auto;
            margin-right: auto;
            padding: 4px;
            transition: width 0.4s;
        }

        button.region-button {
            position: relative;
            width: 200px;
            height: 40px;
            background: black;
            margin: 4px;
        }

        /* fancy ass animations for stuff poping in */
        #scuglist-modded {
            display: block;
            transition: opacity 0.2s, width 0.4s;
        }

        #scuglist-modded.rl-hidden {
            opacity: 0;
            width: 0;
            height: 0;
        }

        #scuglist-modded>.rw-ui {
            transition: width 0.4s, margin 0.4s, padding 0.4s;
            white-space: nowrap;
        }

        #scuglist-modded.rl-hidden>.rw-ui {
            transition: width 0.4s, margin 0.4s, padding 0.4s;
            width: 0px;
            margin-left: 0;
            margin-right: 0;
            padding-left: 0;
            padding-right: 0;
            pointer-events: none;
        }

        #modded-ckb-group {
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
        }

        #modded-ckb {
            position: relative;
            width: 36px;
            height: 36px;
        }

        .difficulty-btn {
            display: inline-block;
            width: 38px;
            height: 38px;
            margin: 4px;
            position: relative;
        }

    </style>

</head>

<body>
        <canvas id="rw-rain-canvas" class="rw-rain-canvas" aria-hidden="true"></canvas>
        <div class="rw-rain-dim" aria-hidden="true"></div>
        </div>
        <div id="rw-rain-toggle-group" class="rw-rain-toggle" hidden>
            <input type="checkbox" id="rw-rain-toggle" class="rw-ui rw-ui-ckb" checked autocomplete="off">
            <label for="rw-rain-toggle" class="rw-text">Enable Rain</label>
        </div>
        <form id="main-menu">
        <div class="rw-title"><canvas id="rw-title-canvas" class="rw-title-image" role="img" aria-label="Rain World Downpour"></canvas></div>
        <div class="rw-bigtext" style="text-align: center; margin-top:0.5em;">I'm lost as...</div>
        <div id="scuglist-group">
            <div id="scuglist-vanilla"></div>
        </div>

        <script>
            let slugcats = {};

            getJsonObject("slugcats.json", function (json) {
                slugcats = json;
                var html = "";
                for (const slugcatName in slugcats) {
                    var icon = "72_unknown";
                    if (slugcatName in icon_by_name) {
                        icon = icon_by_name[slugcatName];
                    } else {
                        console.log("missing icon for " + slugcatName);
                    }
                    html += `
<label class="difficulty-btn">
    <input type="radio" class="rw-ui" name="difficulties" onclick="selectDifficulty('${slugcatName}');" autocomplete="off">
    <img src="./resources/icons/${icon}.png">
</label>`;
                    document.getElementById('scuglist-vanilla').innerHTML = html;
                }
            }, true);

            function selectDifficulty(slugName) {
                window.location.href = `map.html?slugcat=${slugName}&region=${slugcats[slugName].startingRegion}&room=${slugcats[slugName].startingRoom}`;
            }
        </script>

    </form>
